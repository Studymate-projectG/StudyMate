<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - StudyMate</title>
<link rel="stylesheet" href="css/st.css">
</head>
<body>
<header class="hd"><span class="lg">StudyMate</span></header>
<main class="wr nr">
  <div class="bx">
    <h1>Log in</h1>
    <p class="sm">Find study groups for your courses.</p>
    <form id="fm" novalidate>
      <label for="em">University email</label>
      <input id="em" type="email" autocomplete="username">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <div id="ms" class="ms"></div>
      <button id="bt" class="bt" type="submit">Log in</button>
    </form>
    <p class="sm">New here? <a href="signup.html">Create an account</a></p>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/cfg.js"></script>
<script src="js/ap.js"></script>
<script src="js/lg.js"></script>
</body>
</html>
